<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezervări echipamente</title>
<style>
/* Stil Microsoft 365 / Outlook (Fluent). Fonturile sunt cele ale sistemului: nimic încărcat de la terți. */
:root{
  --bg:#f5f5f5; --surface:#ffffff; --sunk:#f0f0f0; --line:#e0e0e0; --line2:#d1d1d1;
  --ink:#242424; --muted:#616161;
  --accent:#0f6cbd; --accent-soft:#ebf3fc; --accent-line:#b4d6fa;
  --primary:#0f6cbd; --primary-hover:#115ea3;
  --appbar:#0f6cbd; --appbar-ink:#ffffff;
  --chalk:#f2c230;
  --ok:#107c10; --ok-soft:#f1faf1; --warn:#bc4b09; --warn-soft:#fff9f5; --bad:#c50f1f; --bad-soft:#fdf3f4;
  --sh2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --sh8:0 0 2px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.14);
  --shadow:0 0 8px rgba(0,0,0,.12),0 32px 64px rgba(0,0,0,.14);
  --f:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:4px; --r2:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1f1f1f; --surface:#292929; --sunk:#333333; --line:#3d3d3d; --line2:#525252;
  --ink:#ffffff; --muted:#adadad;
  --accent:#479ef5; --accent-soft:#082338; --accent-line:#0e4775;
  --primary:#115ea3; --primary-hover:#0f6cbd;
  --appbar:#0a2e4a; --appbar-ink:#ffffff;
  --ok:#54b054; --ok-soft:#052505; --warn:#faa06b; --warn-soft:#4a1e04; --bad:#dc626d; --bad-soft:#3b0509;
  --sh2:0 0 2px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.28);
  --sh8:0 0 2px rgba(0,0,0,.24),0 4px 8px rgba(0,0,0,.28);
  --shadow:0 0 8px rgba(0,0,0,.24),0 32px 64px rgba(0,0,0,.28); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.43}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600;margin:6px 0 0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* bara de sus */
.appbar{position:sticky;top:0;z-index:12;min-height:60px;background:var(--appbar);color:var(--appbar-ink);display:flex;align-items:center;gap:12px;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand h1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand .logo+h1{border-left:1px solid rgba(255,255,255,.45);padding-left:12px}
.eyebrow{font-size:13px;font-weight:600;white-space:nowrap}
.eyebrow b{display:inline-block;width:10px;height:10px;background:var(--chalk);border-radius:2px;margin-right:6px}
.logo{display:block;flex:none;height:42px;width:auto;aspect-ratio:700/231;object-fit:contain;background:#fff;border-radius:var(--r);padding:3px 6px;box-sizing:content-box}
.who{display:flex;gap:10px;align-items:center;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--appbar);display:inline-grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.appbar .linkbtn{color:var(--appbar-ink);text-decoration:underline}
.langsel{border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--appbar-ink);border-radius:var(--r);padding:3px 6px;font-weight:600;font-size:12px}
.langsel option{color:#242424;background:#fff}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.linkbtn:hover{text-decoration:underline}

/* structura: bara de navigare + conținut */
#notice{margin:12px 20px 0}
#screen{padding:20px}
.shell{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{display:flex;flex-direction:column;gap:2px;padding:8px 4px;border-right:1px solid var(--line);background:var(--surface);
  position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.rail button{position:relative;border:0;background:transparent;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;font-size:10.5px;line-height:1.2;color:var(--muted);text-align:center}
.rail button svg.i{width:22px;height:22px}
.rail button:hover{background:var(--sunk);color:var(--ink)}
.rail button[aria-selected="true"]{color:var(--accent);font-weight:600}
.rail button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--accent)}
.content{padding:16px 20px 40px;min-width:0}
.content>section:not(.cal-layout){display:flex;flex-direction:column;gap:16px}

/* calendar */
.cal-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.calmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.eqpane{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh2);padding:12px 6px;position:sticky;top:76px}
.eqpane h2{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 6px}
.eqpane .chips{flex-direction:column;gap:2px}
#eqchips .chip{border:0;background:transparent;width:100%;padding:7px 10px;justify-content:flex-start;font-weight:400;border-radius:var(--r)}
#eqchips .chip:hover{background:var(--sunk)}
#eqchips .chip .eqi{color:var(--muted)}
#eqchips .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
#eqchips .chip[aria-pressed="true"] .eqi{color:var(--accent)}
.eqi{display:inline-flex;flex:none;color:var(--accent)}
.eqi svg.i{width:20px;height:20px}
.eqi.lg{width:40px;height:40px;border-radius:var(--r2);background:var(--accent-soft);align-items:center;justify-content:center}
.eqi.lg svg.i{width:24px;height:24px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.ipk{display:inline-flex;align-items:center;gap:6px;min-width:40px;height:40px;padding:0 9px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);color:var(--ink);font-weight:400;font-size:13px;justify-content:center}
.ipk:hover{background:var(--sunk)}
.ipk[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ipk .eqi{color:inherit}
.ipk[aria-checked="true"] .eqi{color:var(--accent)}
.vswitch{display:inline-flex;margin-left:auto;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.vswitch button{border:0;background:transparent;padding:4px 12px;min-height:30px;font-weight:600;color:var(--muted)}
.vswitch button+button{border-left:1px solid var(--line2)}
.vswitch button:hover{background:var(--sunk);color:var(--ink)}
.vswitch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cell .bk{font-size:12px;line-height:1.3;color:var(--ink);border-left:3px solid var(--accent-line);padding:1px 0 1px 6px;margin-top:2px}
.cell .bk.me{border-left-color:var(--accent)}
.cell .bk small{color:var(--muted)}
table.mo{min-width:560px}
.mo thead th:first-child{width:auto}
.mo td{vertical-align:top}
.daycell{display:flex;flex-direction:column;gap:6px;width:100%;min-height:92px;border:0;background:transparent;text-align:left;padding:6px 8px;font-size:12px}
.daycell:hover{background:var(--accent-soft)}
.daycell .dn{font-family:var(--f-display);font-size:16px;font-weight:600;line-height:1.2}
.daycell.out{opacity:.45}
.daycell.today .dn{color:#fff;background:var(--primary);border-radius:999px;align-self:flex-start;padding:0 8px}
.daycell.has-mine{box-shadow:inset 3px 0 0 var(--accent)}
.daycell .sum{color:var(--muted)}
.daycell .sum b{color:var(--ink)}
.daycell.full .sum b{color:var(--bad)} .daycell.warn .sum b{color:var(--warn)}
.daycell .meter i{background:var(--ok)} .daycell.warn .meter i{background:var(--warn)} .daycell.full .meter i{background:var(--bad)}
#eqchips .chip small{margin-left:auto}
.cmdbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh2);padding:6px 8px}
.cmdbar .btn{border-color:transparent;background:transparent}
.cmdbar .btn:hover{background:var(--sunk)}
.weeklabel{font-family:var(--f-display);font-size:18px;font-weight:600;margin-left:8px}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);padding:4px 12px;border-radius:var(--r);display:flex;gap:8px;align-items:center;min-height:30px}
.chip:hover{background:var(--sunk)}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
.weeknav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}

.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:4px 12px;min-height:32px;border-radius:var(--r);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.icon{padding:4px 6px;min-width:32px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:24px;padding:1px 8px;font-size:12px}
.btn.big{min-height:40px;padding:8px 20px;font-size:15px}

.gridbox{overflow-x:auto;background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh2);transition:opacity .2s}
table.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;table-layout:fixed}
.tt thead th{padding:10px 10px 8px;text-align:left;font-weight:400;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.tt thead th:first-child{width:92px}
.tt thead th span{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--ink);line-height:1.25}
.tt thead th.today{color:var(--accent);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
.tt thead th.today span{color:var(--accent)}
.tt tbody th{text-align:left;padding:8px 10px;font-weight:600;font-size:12px;vertical-align:top;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tt tbody th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tt td{padding:0;border-bottom:1px solid var(--line)}
.tt td+td{border-left:1px solid var(--line)}
.tt tr:last-child>*{border-bottom:0}
.cell{display:flex;flex-direction:column;gap:4px;width:100%;min-height:56px;border:0;background:transparent;text-align:left;padding:6px 8px;font-size:13px}
.cell:hover:not(:disabled){background:var(--accent-soft)}
.cell:disabled{cursor:default;opacity:.5}
.cell .free{font-weight:600}
.cell .free small{font-weight:400;color:var(--muted)}
.cell.full:not(:disabled){background:var(--bad-soft)}
.cell.has-mine,.cell.has-mine:hover:not(:disabled){background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px}
.cell.ok .meter i{background:var(--ok)} .cell.warn .meter i{background:var(--warn)} .cell.full .meter i{background:var(--bad)}
.cell.full .free{color:var(--bad)} .cell.warn .free{color:var(--warn)}
.cell .mine{font-size:11px;font-weight:600;color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}

.panel{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh2);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.empty{text-align:center;padding:36px 18px;align-items:center}
.empty p{max-width:56ch;margin:0}
.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.daytitle{font-weight:600;padding-top:12px;color:var(--accent);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink);min-width:0}
label.f input,label.f select{border:1px solid var(--line2);border-bottom-color:var(--muted);background:var(--surface);border-radius:var(--r);padding:5px 10px;min-height:32px;
  font-weight:400;font-size:14px;color:var(--ink);width:100%}
label.f input:focus,label.f select:focus{outline:none;border-bottom-color:var(--accent);box-shadow:inset 0 -1px 0 var(--accent)}
.full-span{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.notice{padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);font-size:13px}

.login{min-height:60vh;display:flex;align-items:center;justify-content:center}
.login .panel{max-width:440px;text-align:center;align-items:center;padding:32px 28px;box-shadow:var(--sh8)}
.ms{display:inline-flex;gap:10px;align-items:center}
.ms i{display:grid;grid-template-columns:8px 8px;gap:2px}
.ms i b{width:8px;height:8px;display:block}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:var(--r2) var(--r2) 0 0;box-shadow:var(--shadow);
  padding:20px max(20px, env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:var(--r2);padding:24px}}
.sheet header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet header h2{font-size:20px}
.sheet .eyebrow{color:var(--accent);font-size:12px}
.x{border:0;background:transparent;width:32px;height:32px;border-radius:var(--r);font-size:20px;line-height:1;flex:none;color:var(--muted)}
.x:hover{background:var(--sunk);color:var(--ink)}
.big:not(.btn){font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.who-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.who-row:last-child{border-bottom:0}
.who-row .main{flex:1;min-width:0}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:var(--r);
  font-weight:600;z-index:30;box-shadow:var(--sh8);border-left:4px solid var(--ok);max-width:calc(100% - 40px)}

.tablebox{overflow-x:auto}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
.rt th{text-align:left;font-size:12px;font-weight:600;color:var(--ink);padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.rt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tbody tr:hover td{background:var(--sunk)}
.rt tr:last-child td{border-bottom:0}
.rt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .nw{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}
.pill.run{background:var(--ok);color:#fff}
.pill.next{background:var(--accent-soft);color:var(--accent)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.rt tr.cx td{color:var(--muted)}
.rt tr.cx td:nth-child(-n+3){text-decoration:line-through}
.usage{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:8px 14px;align-items:center}
.usage .meter{display:block;height:6px}

@media (max-width:900px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
  .eqpane{position:static;padding:6px}
  .eqpane h2{display:none}
  .eqpane .chips{flex-direction:row;flex-wrap:nowrap;overflow-x:auto}
  #eqchips .chip{width:auto;white-space:nowrap}
}
@media (max-width:700px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:15;flex-direction:row;border-right:0;border-top:1px solid var(--line);
    padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .rail button{flex:1;min-width:0}
  .rail button[aria-selected="true"]::before{left:25%;right:25%;top:0;bottom:auto;width:auto;height:3px}
  .content{padding:12px 12px 96px}
  .who .uname{display:none}
  .brand h1{font-size:15px}
  .logo{height:32px}
  .toast{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .appbar{position:static;background:#fff;color:#000}
  .who,.rail,.noprint,#notice,.toast,.overlay{display:none!important}
  .shell{display:block}
  .content{padding:0}
  .panel{box-shadow:none;padding:0 0 12px}
  .kpi{border:1px solid #ccc}
  .rt th,.rt td{padding:4px 6px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="eyebrow"><b></b><span id="school" data-i18n="schoolDefault"></span></div>
    <h1 data-i18n="appTitle"></h1>
  </div>
  <div class="who">
    <span id="who" class="who"></span>
    <select id="lang" class="langsel" aria-label="Language / Limba / Sprache">
      <option value="ro">RO</option><option value="en">EN</option><option value="de">DE</option>
    </select>
  </div>
</header>

<div id="notice" class="notice" hidden></div>
<div id="screen"></div>

<div id="app" class="shell" hidden>
  <nav class="rail" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-tab="cal"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><span data-i18n="tabCal"></span></button>
    <button role="tab" aria-selected="false" data-tab="mine"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-i18n="tabMine"></span></button>

    tb.append(h("tr",{class:st==="cancel"?"cx":""},withDate?h("td",{class:"nw"},fmtDay(b.date)):null,h("td",{class:"nw num"},pr(b)),h("td",null,eqName(b.eq)),h("td",{class:"n"},b.qty),teacherCell(b),h("td",null,b.cls),h("td",null,b.note),
      full?h("td",null,h("span",{class:"pill "+st},t("st_"+st)),cancelInfo(b)):null,

  return h("div",{class:"tablebox"},h("table",{class:"rt"},h("thead",null,h("tr",null,head.map((x,i)=>h("th",{class:i===qi?"n":""},x)))),tb));

function renderLive(){
  const v=$("view-live");const d=S.liveDate;const td=todayIso();
  const nav=h("div",{class:"weeknav noprint"},
    h("button",{class:"btn","aria-label":t("prevDay"),on:{click:()=>goLive(iso(addDays(parse(d),-1)))}},"‹"),
    h("button",{class:"btn","aria-label":t("nextDay"),on:{click:()=>goLive(iso(addDays(parse(d),1)))}},"›"),
    h("button",{class:"btn",on:{click:()=>goLive(td)}},t("today")),
    h("button",{class:"btn",on:{click:()=>loadLive().then(renderLive).catch(()=>notice(t("refreshFail")))}},t("refreshBtn")));
  const head=h("div",{class:"bar"},h("div",null,h("h2",null,longDay(d)+(d===td?t("todaySfx"):"")),
    h("span",{class:"hint num"},S.liveLoaded&&S.liveAt?t("updatedAt",FX.time.format(S.liveAt)):t("loading"))),nav);
  if(!S.liveLoaded){v.replaceChildren(head,emptyBox(t("loading"),""));return}
  const rows=S.live.slice().sort((a,b)=>a.from-b.from||a.to-b.to||eqName(a.eq).localeCompare(eqName(b.eq),L.locale));

        const r=u/e.qty;usage.append(h("b",null,e.name),h("span",{class:"meter"},h("i",{style:"width:"+Math.min(100,Math.round(r*100))+"%;background:var(--"+(r>=1?"bad":r>=.75?"warn":"ok")+")"})),
          h("span",{class:"pill acc num"},t("outOf",u,e.qty)))}
      box.append(usage,liveTable(now,false))}
    parts.push(box)}

  parts.push(h("div",{class:"panel"},h("h2",null,t("dayList")),h("span",{class:"hint num"},t("dayCount",rows.length-nc)+(nc?" · "+t("cancelCount",nc):"")),
    rows.length?liveTable(rows,true):h("p",{class:"muted",style:"margin:0"},t("dayNone"))));
  const next=(S.liveNext||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.from-b.from||eqName(a.eq).localeCompare(eqName(b.eq),L.locale));
  parts.push(h("div",{class:"panel"},h("h2",null,t("nextTitle")),
    h("span",{class:"hint num"},fmtDay(iso(addDays(parse(d),1)))+" – "+fmtDay(iso(addDays(parse(d),7)))+" · "+t("dayCount",next.length)),
    next.length?liveTable(next,true,true):h("p",{class:"muted",style:"margin:0"},t("nextNone"))));
  v.replaceChildren(...parts);
}

// ---------- admin: reports ----------
function presetRange(k){const n=new Date();let a,b;
  if(k==="tw"){a=monday(n);b=addDays(a,4)}
  else if(k==="lw"){a=addDays(monday(n),-7);b=addDays(a,4)}
  else if(k==="tm"){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
  else if(k==="lm"){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),0)}
  else{const y=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;a=new Date(y,8,1);b=new Date(y+1,7,31)}
  return[iso(a),iso(b)]}
function weekdays(a,b){let n=0;for(let d=parse(a);iso(d)<=b;d=addDays(d,1)){const w=d.getDay();if(w>0&&w<6)n++}return n}
function renderRep(){
  const R=S.rep;if(!R.from){[R.from,R.to]=presetRange("tm")}
  const v=$("view-rep");
  const from=h("input",{type:"date",value:R.from,on:{change:()=>R.from=from.value}});
  const to=h("input",{type:"date",value:R.to,on:{change:()=>R.to=to.value}});
  const eqSel=h("select",{on:{change:()=>{R.eq=eqSel.value;renderRepOut()}}},h("option",{value:""},t("allEq")),S.eq.map(e=>h("option",{value:e.id,selected:R.eq===e.id},e.name)));
  const q=h("input",{type:"search",value:R.q,placeholder:t("teacherPh"),on:{input:()=>{R.q=q.value;renderRepOut()}}});
  const err=h("div",{class:"err",hidden:true});
  const run=h("button",{class:"btn primary",type:"submit"},t("runRep"));
  const presets=h("div",{class:"chips"},[["tw","pThisWeek"],["lw","pLastWeek"],["tm","pThisMonth"],["lm","pLastMonth"],["sy","pSchoolYear"]].map(([k,lbl])=>
    h("button",{class:"chip",type:"button",on:{click:()=>{[R.from,R.to]=presetRange(k);from.value=R.from;to.value=R.to;runRep(run,err)}}},t(lbl))));
  const form=h("form",{class:"grid",on:{submit:e=>{e.preventDefault();runRep(run,err)}}},
    h("div",{class:"full-span"},presets),
    h("label",{class:"f"},t("fromL"),from),h("label",{class:"f"},t("toL"),to),
    h("label",{class:"f"},t("colEq"),eqSel),h("label",{class:"f"},t("teacherL"),q),
    h("div",{class:"full-span actions"},run,err));
  v.replaceChildren(h("div",{class:"panel noprint"},h("h2",null,t("repTitle")),form),h("div",{id:"rep-out",style:"display:flex;flex-direction:column;gap:14px"}));
  renderRepOut();
}
async function runRep(btn,err){
  const R=S.rep;err.hidden=true;
  if(!R.from||!R.to||R.from>R.to){err.textContent=t("rangeErr");err.hidden=false;return}
  R.loading=true;btn.disabled=true;renderRepOut();
  try{const a=R.from,b=R.to;R.rows=await loadRange(a,b,true);R.range=[a,b]}
  catch(e){err.textContent=t("loadFail",e.message);err.hidden=false}
  R.loading=false;btn.disabled=false;renderRepOut();
}
function rtable(head,rows,numCols){
  return h("div",{class:"tablebox"},h("table",{class:"rt"},
    h("thead",null,h("tr",null,head.map((x,i)=>h("th",{class:numCols.includes(i)?"n":""},x)))),
    h("tbody",null,rows.map(r=>h("tr",null,r.map((c,i)=>c instanceof Node&&c.tagName==="TD"?c:h("td",{class:numCols.includes(i)?"n":""},c)))))));
}
function repFiltered(){const R=S.rep;const q=R.q.trim().toLowerCase();
  return R.rows.filter(x=>(!R.eq||x.eq===R.eq)&&(!q||(x.byName+" "+x.byEmail).toLowerCase().includes(q)))
    .sort((x,y)=>x.date.localeCompare(y.date)||x.from-y.from||eqName(x.eq).localeCompare(eqName(y.eq),L.locale))}
function renderRepOut(){
  const out=$("rep-out");if(!out)return;const R=S.rep;
  if(R.loading){out.replaceChildren(emptyBox(t("repLoading"),""));return}
  if(!R.rows){out.replaceChildren();return}
  const[a,b]=R.range;const all=repFiltered();
  const rows=all.filter(x=>!x.cancelled),cx=all.filter(x=>x.cancelled);
  const sub=fmtDay(a)+" – "+fmtDay(b)+(R.eq?" · "+eqName(R.eq):"")+(R.q.trim()?" · „"+R.q.trim()+"“":"");

    h("button",{class:"btn",disabled:!all.length,on:{click:()=>downloadCsv(all,a,b)}},t("csvBtn")),
    h("button",{class:"btn",on:{click:()=>window.print()}},t("printBtn")));
  const top=h("div",{class:"bar"},h("div",null,h("h2",null,t("repTitle")),h("span",{class:"hint num"},sub)),actions);
  if(!all.length){out.replaceChildren(h("div",{class:"panel"},top,h("p",{class:"muted",style:"margin:0"},t("repNone"))));return}
  const ul=x=>x.qty*(x.to-x.from+1);
  const byT=new Map(),byE=new Map();
  const tKey=x=>(x.byEmail||x.byName||"?").toLowerCase();
  const tGet=x=>{const k=tKey(x);let tt=byT.get(k);if(!tt){tt={name:x.byName||x.byEmail||"—",email:x.byEmail,n:0,items:0,ul:0,cx:0};byT.set(k,tt)}return tt};
  for(const x of rows){const tt=tGet(x);tt.n++;tt.items+=x.qty;tt.ul+=ul(x);
    const e=byE.get(x.eq)||{id:x.eq,n:0,items:0,ul:0,cx:0};e.n++;e.items+=x.qty;e.ul+=ul(x);byE.set(x.eq,e)}
  for(const x of cx){tGet(x).cx++;const e=byE.get(x.eq)||{id:x.eq,n:0,items:0,ul:0,cx:0};e.cx++;byE.set(x.eq,e)}
  const wd=weekdays(a,b);const sum=f=>rows.reduce((s,x)=>s+f(x),0);
  const kpis=h("div",{class:"kpis"},
    [[rows.length,"kBookings"],[sum(x=>x.qty),"kItems"],[sum(ul),"kUnitH"],[new Set(rows.map(tKey)).size,"kTeachers"],[cx.length,"kCancelled",cx.length?"bad":""]]
      .map(([n,l,c])=>h("div",{class:"kpi "+(c||"")},h("b",null,FX.num.format(n)),h("span",null,t(l)))));
  const eqRows=[...byE.values()].sort((x,y)=>y.ul-x.ul).map(e=>{const eq=eqById(e.id);const avail=eq?eq.qty*NP*wd:0;
    return[eqName(e.id),e.n,e.items,e.ul,avail?FX.pct.format(e.ul/avail):"—",e.cx]});
  const tRows=[...byT.values()].sort((x,y)=>y.ul-x.ul||y.cx-x.cx||x.name.localeCompare(y.name,L.locale)).map(x=>[h("td",null,h("b",null,x.name)),x.email,x.n,x.items,x.ul,x.cx]);
  const dRows=rows.map(x=>[h("td",{class:"nw"},fmtDay(x.date)),h("td",{class:"nw num"},pr(x)),eqName(x.eq),x.qty,teacherCell(x),x.cls,x.note,h("td",{class:"hint nw"},fmtCreated(x.created))]);
  const cRows=cx.map(x=>[h("td",{class:"nw"},fmtDay(x.date)),h("td",{class:"nw num"},pr(x)),eqName(x.eq),x.qty,teacherCell(x),x.cls,
    h("td",{class:"hint nw"},fmtCreated(x.created)),h("td",{class:"nw"},fmtCreated(x.cancelled)),x.cancelledBy||"—"]);
  out.replaceChildren(h("div",{class:"panel"},top,kpis,
    h("h3",null,t("byEq")),rtable([t("colEq"),t("kBookings"),t("kItems"),t("kUnitH"),t("colUtil"),t("kCancelled")],eqRows,[1,2,3,4,5]),
    h("p",{class:"hint",style:"margin:0"},t("utilHint",wd)),
    h("h3",null,t("byTeacher")),rtable([t("colTeacher"),t("colEmail"),t("kBookings"),t("kItems"),t("kUnitH"),t("kCancelled")],tRows,[2,3,4,5]),
    h("h3",null,t("details")+" ("+rows.length+")"),
    rows.length?rtable([t("colDate"),t("colLessons"),t("colEq"),t("colQty"),t("colTeacher"),t("colClass"),t("colNote"),t("colBooked")],dRows,[3]):h("p",{class:"muted",style:"margin:0"},"—"),
    h("h3",null,t("cxTitle")+" ("+cx.length+")"),
    cx.length?rtable([t("colDate"),t("colLessons"),t("colEq"),t("colQty"),t("colTeacher"),t("colClass"),t("colBooked"),t("colCxAt"),t("colCxBy")],cRows,[3]):h("p",{class:"muted",style:"margin:0"},t("cxNone")),
    h("p",{class:"hint",style:"margin:0"},t("repNote"))));
}
function downloadCsv(rows,a,b){
  const sep=LANG==="en"?",":";";
  const esc=v=>{v=v==null?"":String(v);return /[";,\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[[t("colDate"),t("colFrom"),t("colTo"),t("colTime"),t("colEq"),t("colQty"),t("colTeacher"),t("colEmail"),t("colClass"),t("colNote"),t("colBooked"),t("colStatus"),t("colCxAt"),t("colCxBy")].map(esc).join(sep)];
  for(const x of rows){const pa=PERIODS[x.from-1]||{},pz=PERIODS[x.to-1]||{};
    lines.push([x.date,x.from,x.to,(pa.s||"")+"–"+(pz.e||""),eqName(x.eq),x.qty,x.byName,x.byEmail,x.cls,x.note,fmtCreated(x.created),
      x.cancelled?t("st_cancel"):t("stActive"),fmtCreated(x.cancelled),x.cancelledBy].map(esc).join(sep))}
  const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  const lnk=h("a",{href:url,download:t("csvName")+"_"+a+"_"+b+".csv"});document.body.append(lnk);lnk.click();lnk.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

boot().catch(e=>screen(emptyBox(t("errorT"),e.message||String(e))));
