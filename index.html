<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezervări echipamente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#e9edf3; --line:#d5dbe4;
  --ink:#18202d; --muted:#5b6678;
  --accent:#2446b8; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --chalk:#f2c230;
  --ok:#1d7a4c; --warn:#9a6400; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#f9e0de;
  --shadow:0 10px 30px rgba(20,30,60,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11151c; --surface:#1a2029; --sunk:#232b36; --line:#323c4a;
  --ink:#e8ecf2; --muted:#9aa5b6;
  --accent:#7d9bff; --accent-ink:#0c1226; --accent-soft:#242f52;
  --ok:#5fd19a; --warn:#f0b549; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.logo{display:block;width:200px;max-width:100%;height:auto;aspect-ratio:700/231;object-fit:contain;margin-bottom:8px}
@media (prefers-color-scheme: dark){.logo{background:#fff;padding:6px 10px;border-radius:8px;box-sizing:content-box}}
.eyebrow b{display:inline-block;width:10px;height:10px;background:var(--chalk);border-radius:2px;margin-right:6px;vertical-align:-1px}
.who{font-size:.85rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.langsel{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-weight:700;font-size:.82rem;color:var(--ink)}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;display:flex;gap:8px;align-items:center}
.chip small{font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.weeknav{display:flex;align-items:center;gap:6px}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:700;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.big{padding:12px 20px;font-size:1.05rem}
.weeklabel{font-weight:700;min-width:13ch;text-align:center}

.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:opacity .2s}
table.tt{border-collapse:collapse;width:100%;min-width:640px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:0}
.tt thead th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px;text-align:left;font-weight:700;background:var(--sunk)}
.tt thead th span{display:block;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink);font-family:var(--f-display)}
.tt thead th.today,.tt thead th.today span{color:var(--accent)}
.tt tbody th{text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap;width:1%;border-right:1px solid var(--line)}
.tt tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tt tr:last-child th,.tt tr:last-child td{border-bottom:0}
.cell{display:flex;flex-direction:column;gap:5px;width:100%;min-height:58px;border:0;background:transparent;text-align:left;padding:8px 10px;border-left:1px solid var(--line)}
.cell:hover:not(:disabled){background:var(--accent-soft)}
.cell:disabled{cursor:default;opacity:.45}
.cell .free{font-weight:700;font-size:.92rem}
.cell .free small{font-weight:400;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.cell.ok .meter i{background:var(--ok)} .cell.warn .meter i{background:var(--warn)} .cell.full .meter i{background:var(--bad)}
.cell.full .free{color:var(--bad)} .cell.warn .free{color:var(--warn)}
.cell .mine{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:6px;border-radius:3px;display:inline-block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:36px 18px;align-items:center}
.empty p{max-width:56ch;margin:0}
.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.daytitle{font-family:var(--f-display);font-weight:700;padding-top:10px;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;font-size:.95rem;color:var(--ink);width:100%}
label.f input:focus,label.f select:focus{border-color:var(--accent);outline:none}
.full-span{grid-column:1/-1}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:.9rem}

.login{min-height:60vh;display:flex;align-items:center;justify-content:center}
.login .panel{max-width:460px;text-align:center;align-items:center;padding:32px 24px}
.ms{display:inline-flex;gap:10px;align-items:center}
.ms i{display:grid;grid-template-columns:8px 8px;gap:2px}
.ms i b{width:8px;height:8px;display:block}

.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:20px max(18px, env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;flex:none}
.big{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.who-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.who-row:last-child{border-bottom:0}
.who-row .main{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tablebox{overflow-x:auto}
table.rt{border-collapse:collapse;width:100%;font-size:.9rem}
.rt th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.rt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .nw{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--sunk);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:700}
.pill.run{background:var(--ok);color:var(--surface)}
.pill.next{background:var(--accent-soft);color:var(--accent)}
.pill.cancel{background:var(--bad-soft);color:var(--bad)}
.rt tr.cx td{color:var(--muted)}
.rt tr.cx td:nth-child(-n+3){text-decoration:line-through}
.kpi.bad b{color:var(--bad)}
.usage{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:8px 14px;align-items:center}
.usage .meter{display:block;height:8px}
h3{font-family:var(--f-display);font-size:1rem;margin:6px 0 0}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .who,#tabs,.noprint,#notice,.toast,.overlay{display:none!important}
  .panel{border:0;padding:0 0 12px}
  .kpi{border:1px solid #ccc;background:#fff}
  .rt th,.rt td{padding:4px 6px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow"><b></b><span id="school" data-i18n="schoolDefault"></span></div>
      <h1 data-i18n="appTitle"></h1>
    </div>
    <div class="who">
      <span id="who" class="who"></span>
      <select id="lang" class="langsel" aria-label="Language / Limba / Sprache">
        <option value="ro">RO</option><option value="en">EN</option><option value="de">DE</option>
      </select>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="screen"></div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" data-tab="cal" data-i18n="tabCal"></button>
      <button role="tab" aria-selected="false" data-tab="mine" data-i18n="tabMine"></button>
      <button role="tab" aria-selected="false" data-tab="inv" data-i18n="tabInv"></button>
      <button role="tab" aria-selected="false" data-tab="live" data-i18n="tabLive" class="adm" hidden></button>
      <button role="tab" aria-selected="false" data-tab="rep" data-i18n="tabRep" class="adm" hidden></button>
    </nav>
    <section id="view-cal" style="display:flex;flex-direction:column;gap:14px">
      <div class="bar">
        <div class="chips" id="eqchips"></div>
        <div class="weeknav">
          <button class="btn" id="prevw" data-i18n-aria="prevWeek">‹</button>
          <div class="weeklabel num" id="weeklabel"></div>
          <button class="btn" id="nextw" data-i18n-aria="nextWeek">›</button>
          <button class="btn" id="thisw" data-i18n="today"></button>
        </div>
      </div>
      <div id="calbody"></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i><span data-i18n="legOk"></span></span>
        <span><i style="background:var(--warn)"></i><span data-i18n="legWarn"></span></span>
        <span><i style="background:var(--bad)"></i><span data-i18n="legFull"></span></span>
        <span data-i18n="legHint"></span>
      </div>
    </section>
    <section id="view-mine" hidden></section>
    <section id="view-inv" hidden></section>
    <section id="view-live" hidden style="display:flex;flex-direction:column;gap:14px"></section>
    <section id="view-rep" hidden style="display:flex;flex-direction:column;gap:14px"></section>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="msal-browser.min.js"></script>

function pickLang(){
  let saved=null;try{saved=localStorage.getItem("rez-lang")}catch(e){}
  if(saved&&I18N[saved])return saved;
  const c=(CFG.language||"auto").toLowerCase();if(I18N[c])return c;
  const nav=(navigator.languages||[navigator.language||"en"]).map(x=>x.slice(0,2).toLowerCase());
  return nav.find(x=>I18N[x])||"en";
}
const LANG=pickLang();const L=I18N[LANG];
function t(k,...a){const v=L[k];return typeof v==="function"?v(...a):v}
document.documentElement.lang=LANG;document.title=t("appTitle");
for(const el of document.querySelectorAll("[data-i18n]"))el.textContent=t(el.dataset.i18n);
for(const el of document.querySelectorAll("[data-i18n-aria]"))el.setAttribute("aria-label",t(el.dataset.i18nAria));
const langSel=document.getElementById("lang");langSel.value=LANG;
langSel.addEventListener("change",()=>{try{localStorage.setItem("rez-lang",langSel.value)}catch(e){}location.reload()});

const PERIODS=(CFG.periods||[]).map((p,i)=>({n:i+1,s:p.s,e:p.e}));
const NP=PERIODS.length;
const SCOPES=["User.Read","Sites.ReadWrite.All"];
const SETUP_SCOPES=["Sites.Manage.All"];
const LIST_EQ="Echipamente", LIST_BK="Rezervari";
const GRAPH="https://graph.microsoft.com/v1.0";

const S={pca:null,account:null,admin:false,siteId:null,eqList:null,bkList:null,
  eq:[],week:[],weekLoaded:false,mine:[],mineLoaded:false,sel:null,weekStart:monday(new Date()),tab:"cal",
  open:null,confirm:null,editing:null,busy:false,
  liveDate:null,live:[],liveLoaded:false,liveAt:null,

// ---------- helpers ----------
function h(tag,attrs,...kids){const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="on")for(const ev in v)el.addEventListener(ev,v[ev]);
    else if(k==="class")el.className=v; else if(k==="style")el.style.cssText=v;
    else if(k in el&&k!=="list"&&k!=="form")el[k]=v; else el.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return el;}
const $=id=>document.getElementById(id);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const F={wdLong:new Intl.DateTimeFormat(L.locale,{weekday:"long"}),dm:new Intl.DateTimeFormat(L.locale,{day:"numeric",month:"short"}),
  short:new Intl.DateTimeFormat(L.locale,{weekday:"short",day:"numeric",month:"short"}),long:new Intl.DateTimeFormat(L.locale,{weekday:"long",day:"numeric",month:"long"})};
function fmtDay(s){return cap(F.short.format(parse(s)))}
function longDay(s){return cap(F.long.format(parse(s)))}
function pr(b){const a=PERIODS[b.from-1]||{},z=PERIODS[b.to-1]||{};return b.from===b.to?t("period",b.from)+" ("+a.s+"–"+a.e+")":t("periods",b.from,b.to)+" ("+a.s+"–"+z.e+")"}
function todayIso(){return iso(new Date())}
function passed(date,p){const td=todayIso();if(date<td)return true;if(date>td)return false;
  const[hh,mm]=PERIODS[p-1].e.split(":").map(Number);const n=new Date();return n.getHours()*60+n.getMinutes()>=hh*60+mm;}
function eqById(id){return S.eq.find(e=>e.id===id)}
let toastT;function toast(msg){const el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3500)}
function notice(msg){const n=$("notice");n.textContent=msg||"";n.hidden=!msg}
function booked(list,eq,date,p,filter){let s=0;for(const b of list)if(b.eq===eq&&b.date===date&&b.from<=p&&b.to>=p&&(!filter||filter(b)))s+=b.qty;return s}
function isMine(b){if(!S.account)return false;const oid=S.account.localAccountId||(S.account.idTokenClaims||{}).oid;
  return (b.byId&&oid&&b.byId===oid)||(b.byEmail&&b.byEmail.toLowerCase()===(S.account.username||"").toLowerCase())}
function emptyBox(title,text,...extra){return h("div",{class:"panel empty"},h("h2",null,title),text?h("p",{class:"muted"},text):null,...extra)}

// ---------- auth ----------
function configured(){return CFG.clientId&&!/PUNE-AICI/.test(CFG.clientId)&&CFG.tenantId&&!/PUNE-AICI/.test(CFG.tenantId)&&CFG.siteUrl&&!/NUMESCOALA/.test(CFG.siteUrl)}
function redirectUri(){return location.origin+location.pathname.replace(/index\.html$/,"")}
async function token(scopes){
  try{return (await S.pca.acquireTokenSilent({scopes,account:S.account})).accessToken}
  catch(e){if(e instanceof msal.InteractionRequiredAuthError){await S.pca.acquireTokenRedirect({scopes,account:S.account});return new Promise(()=>{})}throw e}}
async function g(path,opts={},scopes=SCOPES){
  const url=path.startsWith("http")?path:GRAPH+path;
  for(let attempt=0;attempt<3;attempt++){
    const tk=await token(scopes);
    const r=await fetch(url,{method:opts.method||"GET",headers:Object.assign({Authorization:"Bearer "+tk,Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"},opts.body?{"Content-Type":"application/json"}:{}),body:opts.body?JSON.stringify(opts.body):undefined});
    if(r.status===429||r.status===503){await new Promise(res=>setTimeout(res,(+r.headers.get("Retry-After")||2)*1000));continue}
    if(r.status===204)return null;
    const j=await r.json().catch(()=>null);
    if(!r.ok){const err=new Error((j&&j.error&&j.error.message)||("HTTP "+r.status));err.status=r.status;throw err}
    return j;}
  const err=new Error(t("busy"));err.status=429;throw err;}
async function gAll(path){let out=[],next=path;while(next){const j=await g(next);out=out.concat(j.value||[]);next=j["@odata.nextLink"]||null}return out}

// ---------- SharePoint ----------
async function resolveSite(){const u=new URL(CFG.siteUrl);const j=await g("/sites/"+u.hostname+":"+u.pathname.replace(/\/$/,""));S.siteId=j.id}
async function findLists(){const ls=await gAll("/sites/"+S.siteId+"/lists?$select=id,displayName&$top=200");
  S.eqList=(ls.find(l=>l.displayName===LIST_EQ)||{}).id||null;S.bkList=(ls.find(l=>l.displayName===LIST_BK)||{}).id||null}
async function createLists(){
  const base="/sites/"+S.siteId+"/lists";

  const s=mins((PERIODS[b.from-1]||{}).s),e=mins((PERIODS[b.to-1]||{}).e);return m>=e?"done":m>=s?"run":"next"}

function fmtCreated(s){if(!s)return"";const d=new Date(s);return isNaN(d)?"":FX.dt.format(d)}

// ---------- admin: live ----------
function cancelInfo(b){return b.cancelled?h("div",{class:"hint"},t("cancelledBy",fmtCreated(b.cancelled),b.cancelledBy||"—")):null}
// Ziua afișată + următoarele 7 zile (pentru cele viitoare, doar rezervările active).
async function loadLive(){const d=S.liveDate;
  const[rows,next]=await Promise.all([loadRange(d,d,true),loadRange(iso(addDays(parse(d),1)),iso(addDays(parse(d),7)))]);
  if(d!==S.liveDate)return;S.live=rows;S.liveNext=next;S.liveLoaded=true;S.liveAt=new Date()}
function goLive(d){if(d!==S.liveDate){S.liveDate=d;S.liveLoaded=false;S.confirm=null}renderLive();
  loadLive().then(renderLive).catch(()=>notice(t("weekFail")))}
function liveTable(rows,full,withDate){
  const head=[t("colLessons"),t("colEq"),t("colQty"),t("colTeacher"),t("colClass"),t("colNote")];
  if(withDate)head.unshift(t("colDate"));
  if(full)head.push(t("colStatus"),t("colBooked"),"");
  const qi=withDate?3:2;
  const tb=h("tbody");
  for(const b of rows){const st=stateOf(b);
    tb.append(h("tr",{class:st==="cancel"?"cx":""},withDate?h("td",{class:"nw"},fmtDay(b.date)):null,h("td",{class:"nw num"},pr(b)),h("td",null,eqName(b.eq)),h("td",{class:"n"},b.qty),teacherCell(b),h("td",null,b.cls),h("td",null,b.note),
      full?h("td",null,h("span",{class:"pill "+st},t("st_"+st)),cancelInfo(b)):null,
      full?h("td",{class:"hint nw"},fmtCreated(b.created)):null,
      full?h("td",{class:"noprint"},st==="run"||st==="next"?cancelBtn(b,renderLive):null):null))}
  return h("div",{class:"tablebox"},h("table",{class:"rt"},h("thead",null,h("tr",null,head.map((x,i)=>h("th",{class:i===qi?"n":""},x)))),tb));
}
function renderLive(){
  const v=$("view-live");const d=S.liveDate;const td=todayIso();
  const nav=h("div",{class:"weeknav noprint"},
    h("button",{class:"btn","aria-label":t("prevDay"),on:{click:()=>goLive(iso(addDays(parse(d),-1)))}},"‹"),
    h("button",{class:"btn","aria-label":t("nextDay"),on:{click:()=>goLive(iso(addDays(parse(d),1)))}},"›"),
    h("button",{class:"btn",on:{click:()=>goLive(td)}},t("today")),
    h("button",{class:"btn",on:{click:()=>loadLive().then(renderLive).catch(()=>notice(t("refreshFail")))}},t("refreshBtn")));
  const head=h("div",{class:"bar"},h("div",null,h("h2",null,longDay(d)+(d===td?t("todaySfx"):"")),
    h("span",{class:"hint num"},S.liveLoaded&&S.liveAt?t("updatedAt",FX.time.format(S.liveAt)):t("loading"))),nav);
  if(!S.liveLoaded){v.replaceChildren(head,emptyBox(t("loading"),""));return}
  const rows=S.live.slice().sort((a,b)=>a.from-b.from||a.to-b.to||eqName(a.eq).localeCompare(eqName(b.eq),L.locale));
  const parts=[head];
  if(d===td){
    const now=rows.filter(b=>stateOf(b)==="run");
    const box=h("div",{class:"panel"},h("h2",null,t("nowOut")));
    if(!now.length)box.append(h("p",{class:"muted",style:"margin:0"},t("nowNone")));
    else{const usage=h("div",{class:"usage"});
      for(const e of S.eq){const u=now.filter(b=>b.eq===e.id).reduce((s,b)=>s+b.qty,0);if(!u)continue;
        const r=u/e.qty;usage.append(h("b",null,e.name),h("span",{class:"meter"},h("i",{style:"width:"+Math.min(100,Math.round(r*100))+"%;background:var(--"+(r>=1?"bad":r>=.75?"warn":"ok")+")"})),
          h("span",{class:"pill acc num"},t("outOf",u,e.qty)))}
      box.append(usage,liveTable(now,false))}
    parts.push(box)}
  const nc=rows.filter(b=>b.cancelled).length;
  parts.push(h("div",{class:"panel"},h("h2",null,t("dayList")),h("span",{class:"hint num"},t("dayCount",rows.length-nc)+(nc?" · "+t("cancelCount",nc):"")),
    rows.length?liveTable(rows,true):h("p",{class:"muted",style:"margin:0"},t("dayNone"))));
  const next=(S.liveNext||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.from-b.from||eqName(a.eq).localeCompare(eqName(b.eq),L.locale));
  parts.push(h("div",{class:"panel"},h("h2",null,t("nextTitle")),
    h("span",{class:"hint num"},fmtDay(iso(addDays(parse(d),1)))+" – "+fmtDay(iso(addDays(parse(d),7)))+" · "+t("dayCount",next.length)),
    next.length?liveTable(next,true,true):h("p",{class:"muted",style:"margin:0"},t("nextNone"))));
  v.replaceChildren(...parts);
}

// ---------- admin: reports ----------
function presetRange(k){const n=new Date();let a,b;
  if(k==="tw"){a=monday(n);b=addDays(a,4)}
  else if(k==="lw"){a=addDays(monday(n),-7);b=addDays(a,4)}
  else if(k==="tm"){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
  else if(k==="lm"){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),0)}
  else{const y=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;a=new Date(y,8,1);b=new Date(y+1,7,31)}
  return[iso(a),iso(b)]}
function weekdays(a,b){let n=0;for(let d=parse(a);iso(d)<=b;d=addDays(d,1)){const w=d.getDay();if(w>0&&w<6)n++}return n}
function renderRep(){
  const R=S.rep;if(!R.from){[R.from,R.to]=presetRange("tm")}
  const v=$("view-rep");
  const from=h("input",{type:"date",value:R.from,on:{change:()=>R.from=from.value}});
  const to=h("input",{type:"date",value:R.to,on:{change:()=>R.to=to.value}});
  const eqSel=h("select",{on:{change:()=>{R.eq=eqSel.value;renderRepOut()}}},h("option",{value:""},t("allEq")),S.eq.map(e=>h("option",{value:e.id,selected:R.eq===e.id},e.name)));
  const q=h("input",{type:"search",value:R.q,placeholder:t("teacherPh"),on:{input:()=>{R.q=q.value;renderRepOut()}}});
  const err=h("div",{class:"err",hidden:true});
  const run=h("button",{class:"btn primary",type:"submit"},t("runRep"));
  const presets=h("div",{class:"chips"},[["tw","pThisWeek"],["lw","pLastWeek"],["tm","pThisMonth"],["lm","pLastMonth"],["sy","pSchoolYear"]].map(([k,lbl])=>
    h("button",{class:"chip",type:"button",on:{click:()=>{[R.from,R.to]=presetRange(k);from.value=R.from;to.value=R.to;runRep(run,err)}}},t(lbl))));
  const form=h("form",{class:"grid",on:{submit:e=>{e.preventDefault();runRep(run,err)}}},
    h("div",{class:"full-span"},presets),
    h("label",{class:"f"},t("fromL"),from),h("label",{class:"f"},t("toL"),to),
    h("label",{class:"f"},t("colEq"),eqSel),h("label",{class:"f"},t("teacherL"),q),
    h("div",{class:"full-span actions"},run,err));
  v.replaceChildren(h("div",{class:"panel noprint"},h("h2",null,t("repTitle")),form),h("div",{id:"rep-out",style:"display:flex;flex-direction:column;gap:14px"}));
  renderRepOut();
}
async function runRep(btn,err){
  const R=S.rep;err.hidden=true;
  if(!R.from||!R.to||R.from>R.to){err.textContent=t("rangeErr");err.hidden=false;return}
  R.loading=true;btn.disabled=true;renderRepOut();
  try{const a=R.from,b=R.to;R.rows=await loadRange(a,b,true);R.range=[a,b]}
  catch(e){err.textContent=t("loadFail",e.message);err.hidden=false}
  R.loading=false;btn.disabled=false;renderRepOut();
}
function rtable(head,rows,numCols){
  return h("div",{class:"tablebox"},h("table",{class:"rt"},
    h("thead",null,h("tr",null,head.map((x,i)=>h("th",{class:numCols.includes(i)?"n":""},x)))),
    h("tbody",null,rows.map(r=>h("tr",null,r.map((c,i)=>c instanceof Node&&c.tagName==="TD"?c:h("td",{class:numCols.includes(i)?"n":""},c)))))));
}
function repFiltered(){const R=S.rep;const q=R.q.trim().toLowerCase();
  return R.rows.filter(x=>(!R.eq||x.eq===R.eq)&&(!q||(x.byName+" "+x.byEmail).toLowerCase().includes(q)))
    .sort((x,y)=>x.date.localeCompare(y.date)||x.from-y.from||eqName(x.eq).localeCompare(eqName(y.eq),L.locale))}
function renderRepOut(){
  const out=$("rep-out");if(!out)return;const R=S.rep;
  if(R.loading){out.replaceChildren(emptyBox(t("repLoading"),""));return}
  if(!R.rows){out.replaceChildren();return}
  const[a,b]=R.range;const all=repFiltered();
  const rows=all.filter(x=>!x.cancelled),cx=all.filter(x=>x.cancelled);
  const sub=fmtDay(a)+" – "+fmtDay(b)+(R.eq?" · "+eqName(R.eq):"")+(R.q.trim()?" · „"+R.q.trim()+"“":"");
  const actions=h("div",{class:"actions noprint"},
    h("button",{class:"btn",disabled:!all.length,on:{click:()=>downloadCsv(all,a,b)}},t("csvBtn")),
    h("button",{class:"btn",on:{click:()=>window.print()}},t("printBtn")));
  const top=h("div",{class:"bar"},h("div",null,h("h2",null,t("repTitle")),h("span",{class:"hint num"},sub)),actions);
  if(!all.length){out.replaceChildren(h("div",{class:"panel"},top,h("p",{class:"muted",style:"margin:0"},t("repNone"))));return}
  const ul=x=>x.qty*(x.to-x.from+1);
  const byT=new Map(),byE=new Map();
  const tKey=x=>(x.byEmail||x.byName||"?").toLowerCase();
  const tGet=x=>{const k=tKey(x);let tt=byT.get(k);if(!tt){tt={name:x.byName||x.byEmail||"—",email:x.byEmail,n:0,items:0,ul:0,cx:0};byT.set(k,tt)}return tt};
  for(const x of rows){const tt=tGet(x);tt.n++;tt.items+=x.qty;tt.ul+=ul(x);
    const e=byE.get(x.eq)||{id:x.eq,n:0,items:0,ul:0,cx:0};e.n++;e.items+=x.qty;e.ul+=ul(x);byE.set(x.eq,e)}
  for(const x of cx){tGet(x).cx++;const e=byE.get(x.eq)||{id:x.eq,n:0,items:0,ul:0,cx:0};e.cx++;byE.set(x.eq,e)}
  const wd=weekdays(a,b);const sum=f=>rows.reduce((s,x)=>s+f(x),0);
  const kpis=h("div",{class:"kpis"},
    [[rows.length,"kBookings"],[sum(x=>x.qty),"kItems"],[sum(ul),"kUnitH"],[new Set(rows.map(tKey)).size,"kTeachers"],[cx.length,"kCancelled",cx.length?"bad":""]]
      .map(([n,l,c])=>h("div",{class:"kpi "+(c||"")},h("b",null,FX.num.format(n)),h("span",null,t(l)))));
  const eqRows=[...byE.values()].sort((x,y)=>y.ul-x.ul).map(e=>{const eq=eqById(e.id);const avail=eq?eq.qty*NP*wd:0;
    return[eqName(e.id),e.n,e.items,e.ul,avail?FX.pct.format(e.ul/avail):"—",e.cx]});
  const tRows=[...byT.values()].sort((x,y)=>y.ul-x.ul||y.cx-x.cx||x.name.localeCompare(y.name,L.locale)).map(x=>[h("td",null,h("b",null,x.name)),x.email,x.n,x.items,x.ul,x.cx]);
  const dRows=rows.map(x=>[h("td",{class:"nw"},fmtDay(x.date)),h("td",{class:"nw num"},pr(x)),eqName(x.eq),x.qty,teacherCell(x),x.cls,x.note,h("td",{class:"hint nw"},fmtCreated(x.created))]);
  const cRows=cx.map(x=>[h("td",{class:"nw"},fmtDay(x.date)),h("td",{class:"nw num"},pr(x)),eqName(x.eq),x.qty,teacherCell(x),x.cls,
    h("td",{class:"hint nw"},fmtCreated(x.created)),h("td",{class:"nw"},fmtCreated(x.cancelled)),x.cancelledBy||"—"]);
  out.replaceChildren(h("div",{class:"panel"},top,kpis,
    h("h3",null,t("byEq")),rtable([t("colEq"),t("kBookings"),t("kItems"),t("kUnitH"),t("colUtil"),t("kCancelled")],eqRows,[1,2,3,4,5]),
    h("p",{class:"hint",style:"margin:0"},t("utilHint",wd)),
    h("h3",null,t("byTeacher")),rtable([t("colTeacher"),t("colEmail"),t("kBookings"),t("kItems"),t("kUnitH"),t("kCancelled")],tRows,[2,3,4,5]),
    h("h3",null,t("details")+" ("+rows.length+")"),
    rows.length?rtable([t("colDate"),t("colLessons"),t("colEq"),t("colQty"),t("colTeacher"),t("colClass"),t("colNote"),t("colBooked")],dRows,[3]):h("p",{class:"muted",style:"margin:0"},"—"),
    h("h3",null,t("cxTitle")+" ("+cx.length+")"),
    cx.length?rtable([t("colDate"),t("colLessons"),t("colEq"),t("colQty"),t("colTeacher"),t("colClass"),t("colBooked"),t("colCxAt"),t("colCxBy")],cRows,[3]):h("p",{class:"muted",style:"margin:0"},t("cxNone")),
    h("p",{class:"hint",style:"margin:0"},t("repNote"))));
}
function downloadCsv(rows,a,b){
  const sep=LANG==="en"?",":";";
  const esc=v=>{v=v==null?"":String(v);return /[";,\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[[t("colDate"),t("colFrom"),t("colTo"),t("colTime"),t("colEq"),t("colQty"),t("colTeacher"),t("colEmail"),t("colClass"),t("colNote"),t("colBooked"),t("colStatus"),t("colCxAt"),t("colCxBy")].map(esc).join(sep)];
  for(const x of rows){const pa=PERIODS[x.from-1]||{},pz=PERIODS[x.to-1]||{};
    lines.push([x.date,x.from,x.to,(pa.s||"")+"–"+(pz.e||""),eqName(x.eq),x.qty,x.byName,x.byEmail,x.cls,x.note,fmtCreated(x.created),
      x.cancelled?t("st_cancel"):t("stActive"),fmtCreated(x.cancelled),x.cancelledBy].map(esc).join(sep))}
  const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));
  const lnk=h("a",{href:url,download:t("csvName")+"_"+a+"_"+b+".csv"});document.body.append(lnk);lnk.click();lnk.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

boot().catch(e=>screen(emptyBox(t("errorT"),e.message||String(e))));
})();
