<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezervări echipamente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#e9edf3; --line:#d5dbe4;
  --ink:#18202d; --muted:#5b6678;
  --accent:#2446b8; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --chalk:#f2c230;
  --ok:#1d7a4c; --warn:#9a6400; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#f9e0de;
  --shadow:0 10px 30px rgba(20,30,60,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11151c; --surface:#1a2029; --sunk:#232b36; --line:#323c4a;
  --ink:#e8ecf2; --muted:#9aa5b6;
  --accent:#7d9bff; --accent-ink:#0c1226; --accent-soft:#242f52;
  --ok:#5fd19a; --warn:#f0b549; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1c1a;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.eyebrow b{display:inline-block;width:10px;height:10px;background:var(--chalk);border-radius:2px;margin-right:6px;vertical-align:-1px}
.who{font-size:.85rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.langsel{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-weight:700;font-size:.82rem;color:var(--ink)}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;display:flex;gap:8px;align-items:center}
.chip small{font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.weeknav{display:flex;align-items:center;gap:6px}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:700;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.big{padding:12px 20px;font-size:1.05rem}
.weeklabel{font-weight:700;min-width:13ch;text-align:center}

.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:opacity .2s}
table.tt{border-collapse:collapse;width:100%;min-width:640px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:0}
.tt thead th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px;text-align:left;font-weight:700;background:var(--sunk)}
.tt thead th span{display:block;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink);font-family:var(--f-display)}
.tt thead th.today,.tt thead th.today span{color:var(--accent)}
.tt tbody th{text-align:left;padding:8px 10px;font-weight:700;white-space:nowrap;width:1%;border-right:1px solid var(--line)}
.tt tbody th small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tt tr:last-child th,.tt tr:last-child td{border-bottom:0}
.cell{display:flex;flex-direction:column;gap:5px;width:100%;min-height:58px;border:0;background:transparent;text-align:left;padding:8px 10px;border-left:1px solid var(--line)}
.cell:hover:not(:disabled){background:var(--accent-soft)}
.cell:disabled{cursor:default;opacity:.45}
.cell .free{font-weight:700;font-size:.92rem}
.cell .free small{font-weight:400;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.cell.ok .meter i{background:var(--ok)} .cell.warn .meter i{background:var(--warn)} .cell.full .meter i{background:var(--bad)}
.cell.full .free{color:var(--bad)} .cell.warn .free{color:var(--warn)}
.cell .mine{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:6px;border-radius:3px;display:inline-block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:36px 18px;align-items:center}
.empty p{max-width:56ch;margin:0}
.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.daytitle{font-family:var(--f-display);font-weight:700;padding-top:10px;color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:0}
label.f input,label.f select{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;font-size:.95rem;color:var(--ink);width:100%}
label.f input:focus,label.f select:focus{border-color:var(--accent);outline:none}
.full-span{grid-column:1/-1}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:.9rem}

.login{min-height:60vh;display:flex;align-items:center;justify-content:center}
.login .panel{max-width:460px;text-align:center;align-items:center;padding:32px 24px}
.ms{display:inline-flex;gap:10px;align-items:center}
.ms i{display:grid;grid-template-columns:8px 8px;gap:2px}
.ms i b{width:8px;height:8px;display:block}

.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:20px max(18px, env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;flex:none}
.big{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.who-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.who-row:last-child{border-bottom:0}
.who-row .main{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow"><b></b><span id="school" data-i18n="schoolDefault"></span></div>
      <h1 data-i18n="appTitle"></h1>
    </div>
    <div class="who">
      <span id="who" class="who"></span>
      <select id="lang" class="langsel" aria-label="Language / Limba / Sprache">
        <option value="ro">RO</option><option value="en">EN</option><option value="de">DE</option>
      </select>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="screen"></div>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" data-tab="cal" data-i18n="tabCal"></button>
      <button role="tab" aria-selected="false" data-tab="mine" data-i18n="tabMine"></button>
      <button role="tab" aria-selected="false" data-tab="inv" data-i18n="tabInv"></button>
    </nav>
    <section id="view-cal" style="display:flex;flex-direction:column;gap:14px">
      <div class="bar">
        <div class="chips" id="eqchips"></div>
        <div class="weeknav">
          <button class="btn" id="prevw" data-i18n-aria="prevWeek">‹</button>
          <div class="weeklabel num" id="weeklabel"></div>
          <button class="btn" id="nextw" data-i18n-aria="nextWeek">›</button>
          <button class="btn" id="thisw" data-i18n="today"></button>
        </div>
      </div>
      <div id="calbody"></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i><span data-i18n="legOk"></span></span>
        <span><i style="background:var(--warn)"></i><span data-i18n="legWarn"></span></span>
        <span><i style="background:var(--bad)"></i><span data-i18n="legFull"></span></span>
        <span data-i18n="legHint"></span>
      </div>
    </section>
    <section id="view-mine" hidden></section>
    <section id="view-inv" hidden></section>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>

    h("header",null,h("div",null,h("div",{class:"eyebrow"},eq.name),h("h2",null,longDay(date)+" · "+t("period",p)),h("div",{class:"muted num"},per.s+"–"+per.e)),
      h("button",{class:"x","aria-label":t("close"),on:{click:closeSheet}},"×")),
    h("div",null,h("div",{class:"big num",style:"color:var(--"+(free===0?"bad":"ok")+")"},free),h("div",{class:"hint"},t("freeLabel",eq.qty)))];
  if(here.length){const list=h("div",{class:"list"});
    for(const b of here){const mine=isMine(b);const can=(mine||S.admin)&&!passed(b.date,b.to);
      list.append(h("div",{class:"who-row"},h("div",{class:"main"},h("b",null,mine?t("you"):(b.byName||t("aTeacher"))),
        h("div",{class:"hint num"},t("pcs",b.qty)+" · "+pr(b)+(b.cls?t("cls",b.cls):"")+(b.note?" · "+b.note:""))),
        can?cancelBtn(b,()=>renderSheet()):null))}
    kids.push(h("div",null,h("div",{class:"eyebrow"},t("bookedAlready")),list))}
  if(past)kids.push(h("p",{class:"hint"},t("pastHour")));
  else if(free===0)kids.push(h("p",{class:"hint"},t("noneFree")));
  else kids.push(bookForm(eq,date,p));
  $("sheet").replaceChildren(...kids);
  if(focus){const f=$("sheet").querySelector("#bk-qty");(f||$("sheet").querySelector(".x")).focus()}
}
function maxFree(list,eq,date,from,to,filter){let m=Infinity;for(let q=from;q<=to;q++)m=Math.min(m,eq.qty-booked(list,eq.id,date,q,filter));return Math.max(0,m)}
function bookForm(eq,date,p){
  const err=h("div",{class:"err",hidden:true});
  const to=h("select",{id:"bk-to"});
  for(let q=p;q<=NP;q++){if(maxFree(S.week,eq,date,p,q)<1)break;to.append(h("option",{value:q},q===p?t("onlyP",p):t("untilP",q)))}
  const qty=h("input",{id:"bk-qty",type:"number",min:1,value:1,inputMode:"numeric"});
  const cls=h("input",{id:"bk-cls",type:"text",placeholder:t("classPh"),maxLength:20});
  const note=h("input",{id:"bk-note",type:"text",placeholder:t("notePh"),maxLength:120});
  const hint=h("div",{class:"hint num"});
  const submit=h("button",{class:"btn primary",type:"submit"});
  function upd(){const mx=maxFree(S.week,eq,date,p,+to.value);qty.max=mx;hint.textContent=t("maxHint",mx);submit.textContent=t("bookBtn",+qty.value||0,eq.name)}
  to.onchange=upd;qty.oninput=upd;upd();
  function fail(m){err.textContent=m;err.hidden=false;submit.disabled=false;upd();S.busy=false}
  return h("form",{class:"grid",on:{submit:async e=>{e.preventDefault();err.hidden=true;
    const n=Math.floor(+qty.value),end=+to.value;
    if(!(n>=1))return fail(t("minOne"));
    submit.disabled=true;submit.textContent=t("checking");S.busy=true;
    try{
      await loadWeek();
      const mx=maxFree(S.week,eq,date,p,end);
      if(n>mx){renderCal();return fail(t("onlyX",mx))}
      submit.textContent=t("saving");
      const created=await g(items(S.bkList),{method:"POST",body:{fields:{Title:eq.name+" · "+date+" · "+p+(end>p?"–"+end:""),
        EchipamentId:eq.id,Data:date,OraStart:p,OraSfarsit:end,Cantitate:n,Clasa:cls.value.trim(),Nota:note.value.trim()}}});
      // Rezervări simultane: cea creată ultima (id mai mare) cedează.
      await loadWeek();
      const myId=+created.id;const earlier=b=>+b.id<myId;
      if(maxFree(S.week,eq,date,p,end,earlier)<n){await g(items(S.bkList)+"/"+created.id,{method:"DELETE"});await loadWeek();renderCal();return fail(t("raceLost"))}
      S.busy=false;toast(t("bookedToast",n,eq.name,fmtDay(date)));closeSheet();renderCal();
    }catch(x){fail(x.status===403?t("noWrite"):t("saveFail",x.message))}}}},
    h("div",{class:"eyebrow full-span"},t("newBooking")),
    h("label",{class:"f"},t("qtyL"),qty),h("label",{class:"f"},t("intervalL"),to),
    h("label",{class:"f"},t("classL"),cls),h("label",{class:"f"},t("noteL"),note),
    h("div",{class:"full-span",style:"display:flex;flex-direction:column;gap:8px"},hint,err,submit));
}
function cancelBtn(b,after){
  if(S.confirm===b.id)return h("span",{class:"actions"},
    h("button",{class:"btn sm danger solid",on:{click:async ev=>{ev.target.disabled=true;
      try{await g(items(S.bkList)+"/"+b.id,{method:"DELETE"});toast(t("cancelled"));S.week=S.week.filter(x=>x.id!==b.id);S.mine=S.mine.filter(x=>x.id!==b.id)}
      catch(x){toast(x.status===403?t("cancelOwn"):t("cancelFail"))}
      S.confirm=null;after();renderCal()}}},t("yesCancel")),
    h("button",{class:"btn sm",on:{click:()=>{S.confirm=null;after()}}},t("no")));
  return h("button",{class:"btn sm danger",on:{click:()=>{S.confirm=b.id;after()}}},t("cancel"));
}

// ---------- my bookings ----------
function renderMine(){
  const v=$("view-mine");
  if(!S.mineLoaded){v.replaceChildren(emptyBox(t("mineLoading"),""));return}
  const td=todayIso();const up=S.mine.filter(b=>b.date>=td).sort((a,b)=>a.date.localeCompare(b.date)||a.from-b.from);
  if(!up.length){v.replaceChildren(emptyBox(t("noMineT"),t("noMineP"),h("button",{class:"btn primary",on:{click:()=>{S.tab="cal";renderTabs()}}},t("bookNow"))));return}
  const list=h("div",{class:"list"});let last="";
  for(const b of up){
    if(b.date!==last){list.append(h("div",{class:"daytitle"},longDay(b.date)+(b.date===td?t("todaySfx"):"")));last=b.date}
    const eq=eqById(b.eq);
    list.append(h("div",{class:"row"},h("div",{class:"main"},h("b",null,b.qty+" × "+(eq?eq.name:t("eqDeleted"))),
      h("span",{class:"hint num"},pr(b)+(b.cls?t("cls",b.cls):"")+(b.note?" · "+b.note:""))),
      passed(b.date,b.to)?h("span",{class:"pill"},t("ended")):cancelBtn(b,renderMine)));
  }
  v.replaceChildren(h("div",{class:"panel"},h("h2",null,t("mineTitle")),h("span",{class:"hint num"},t("mineCount",up.length)),list));
}

// ---------- inventory ----------
function renderInv(){
  const v=$("view-inv");const parts=[];const list=h("div",{class:"list"});
  for(const e of S.eq){
    const row=h("div",{class:"row"},h("div",{class:"main"},h("b",null,e.name),e.note?h("span",{class:"hint"},e.note):null),h("span",{class:"pill acc num"},t("pcs",e.qty)));
    if(S.admin){
      if(S.confirm==="eq:"+e.id)row.append(h("span",{class:"actions"},h("span",{class:"hint"},t("delQ")),
        h("button",{class:"btn sm danger solid",on:{click:async()=>{try{await g(items(S.eqList)+"/"+e.id,{method:"DELETE"});toast(t("deletedT",e.name));await loadEq()}catch(x){toast(t("delFail"))}S.confirm=null;renderChips();renderInv()}}},t("yesDel")),
        h("button",{class:"btn sm",on:{click:()=>{S.confirm=null;renderInv()}}},t("no"))));
      else row.append(h("span",{class:"actions"},h("button",{class:"btn sm",on:{click:()=>{S.editing=e.id;renderInv()}}},t("edit")),
        h("button",{class:"btn sm danger",on:{click:()=>{S.confirm="eq:"+e.id;renderInv()}}},t("del"))));
    }
    list.append(row);if(S.admin&&S.editing===e.id)list.append(eqForm(e));
  }
  parts.push(h("div",{class:"panel"},h("h2",null,t("eqTitle")),
    S.eq.length?list:h("p",{class:"muted",style:"margin:0"},S.admin?t("eqEmptyAdmin"):t("eqEmptyUser")),
    !S.admin?h("p",{class:"hint",style:"margin:0"},t("adminOnly")):null));
  if(S.admin)parts.push(h("div",{class:"panel"},h("h2",null,t("addEq")),
    h("div",{class:"chips"},h("span",{class:"hint",style:"align-self:center"},t("quick")),L.quickNames.map(n=>h("button",{class:"chip",type:"button",on:{click:()=>{$("eq-name-new").value=n;$("eq-qty-new").focus()}}},n))),
    eqForm(null)));
  v.replaceChildren(...parts);
}
function eqForm(e){
  const sfx=e?e.id:"new";
  const name=h("input",{id:"eq-name-"+sfx,type:"text",required:true,maxLength:60,value:e?e.name:"",placeholder:t("namePh")});
  const qty=h("input",{id:"eq-qty-"+sfx,type:"number",min:1,max:999,required:true,value:e?e.qty:"",placeholder:t("qtyPh")});
  const note=h("input",{id:"eq-note-"+sfx,type:"text",maxLength:120,value:e?e.note:"",placeholder:t("noteEqPh")});
  const err=h("div",{class:"err",hidden:true});
  return h("form",{class:"grid",style:e?"padding:10px 0 14px":"",on:{submit:async ev=>{ev.preventDefault();err.hidden=true;
    const n=Math.floor(+qty.value),nm=name.value.trim();
    if(!nm||!(n>=1)){err.textContent=t("fillErr");err.hidden=false;return}
    try{const fields={Title:nm,Cantitate:n,Nota:note.value.trim()};
      if(e){await g(items(S.eqList)+"/"+e.id+"/fields",{method:"PATCH",body:fields});S.editing=null;toast(t("saved"))}
      else{const r=await g(items(S.eqList),{method:"POST",body:{fields}});S.sel=r.id;toast(t("added",nm))}
      await loadEq();renderChips();renderInv();}
    catch(x){err.textContent=x.status===403?t("noInvRight"):t("notSaved",x.message);err.hidden=false}}}},
    h("label",{class:"f"},t("nameL"),name),h("label",{class:"f"},t("pcsL"),qty),h("label",{class:"f full-span"},t("noteEqL"),note),
    h("div",{class:"full-span actions"},h("button",{class:"btn primary",type:"submit"},e?t("save"):t("addBtn")),
      e?h("button",{class:"btn",type:"button",on:{click:()=>{S.editing=null;renderInv()}}},t("cancelEdit")):null,err));
}

boot().catch(e=>screen(emptyBox(t("errorT"),e.message||String(e))));
})();
</script>
